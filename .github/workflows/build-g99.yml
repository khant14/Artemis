name: Build G99 APK

on:
  workflow_dispatch:
  push:
    branches: [ 'claude/sharp-euler-nz9ulh' ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install NDK
        # The runner image ships the Android SDK at $ANDROID_HOME
        run: |
          SDKMANAGER=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "ndk;27.0.12077973" "platforms;android-36"

      - name: Restore signing key
        # Reuse the same generated key across runs so new builds install as updates
        uses: actions/cache@v4
        with:
          path: ~/.artemis-signing/release.jks
          key: artemis-g99-signing-key-v1

      - name: Create signing key
        # Throwaway key so the release (non-debuggable) build is installable.
        # Set a KEYSTORE_BASE64 secret to keep the same signature across builds.
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          else
            mkdir -p ~/.artemis-signing
            if [ ! -f ~/.artemis-signing/release.jks ]; then
              keytool -genkeypair -v -keystore ~/.artemis-signing/release.jks -storepass android -keypass android \
                -alias artemis -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Artemis G99"
            fi
            cp ~/.artemis-signing/release.jks "$RUNNER_TEMP/release.jks"
          fi

      - name: Build
        env:
          ARTEMIS_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          ARTEMIS_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'android' }}
          ARTEMIS_KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'artemis' }}
          ARTEMIS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleNonRoot_gameRelease -PdeviceTarget=g99 -PbuildNumber=${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: artemis-g99-release
          path: app/build/outputs/apk/nonRoot_game/release/*.apk
